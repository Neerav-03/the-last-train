<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>THE LAST TRAIN</title>
    <meta name="description" content="THE LAST TRAIN is a psychological horror game that runs in your browser. 2:17 AM. A train arrives that isn't on any schedule. You get on." />
    <meta name="theme-color" content="#060608" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Last Train" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="THE LAST TRAIN" />
    <meta property="og:title" content="THE LAST TRAIN" />
    <meta property="og:description" content="2:17 AM. A train arrives that isn't on any schedule. You get on. A psychological horror game for the browser." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="THE LAST TRAIN" />
    <meta name="twitter:description" content="2:17 AM. A train arrives that isn't on any schedule. You get on." />
  </head>
  <body>
    <noscript>
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:2rem;background:#060608;color:#c9cdd6;font-family:'Courier Prime','Courier New',monospace;text-align:center;line-height:1.6">
        <p>The platform is dark. THE LAST TRAIN needs JavaScript to run.<br />Enable it and reload to board.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Offline cache (public/sw.js). Never registered on localhost, so dev and
      // `vite preview` always run uncached.
      if ('serviceWorker' in navigator && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('%BASE_URL%sw.js', { scope: '%BASE_URL%' }).catch(function () {});
        });
      }
    </script>
  </body>
</html>
